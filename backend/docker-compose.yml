version: "3.8"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-gestor_inadimplencia}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-gestor_inadimplencia}?schema=public
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - ./.env:/app/.env
      # Documentos anexados ao Jurídico (ver AJUSTE 11 — "Documentos
      # anexados ao associado, visíveis no card Jurídico") ficam em disco,
      # dentro do container, no caminho padrão de JURIDICO_UPLOADS_DIR (ver
      # src/config/env.js: "<raiz do backend>/uploads/juridico" quando a
      # variável não é definida). Sem este volume nomeado, os arquivos
      # seriam perdidos a cada "docker compose up --build" (o filesystem do
      # container é recriado do zero) — mesmo risco documentado pra
      # EasyPanel na seção "## Deploy no EasyPanel" deste README, só que lá
      # a configuração é feita manualmente na UI (não tem docker-compose.yml
      # de verdade em produção).
      - juridico_uploads:/app/uploads/juridico

volumes:
  db_data:
  juridico_uploads:
